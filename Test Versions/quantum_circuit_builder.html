<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Circuit Builder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    background: #080b14;
    color: #e2e8f0;
    padding: 24px;
    min-height: 100vh;
  }

  /* Header */
  .eyebrow { font-size: 9px; color: #3b82f6; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 4px; }
  .title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
  .subtitle { font-size: 10px; color: #475569; margin-bottom: 20px; }

  /* Toolbar */
  .toolbar {
    background: #0d1426; border: 1px solid #1e2d5e; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .gate-btn {
    width: 40px; height: 34px; border-radius: 5px;
    border: 2px solid #1e2d5e; background: transparent;
    color: #475569; font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: all 0.1s;
  }
  .divider { width: 1px; height: 24px; background: #1e2d5e; margin: 0 4px; flex-shrink: 0; }
  .gate-title { font-size: 11px; font-weight: 600; min-width: 110px; }
  .right-group { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label-xs { font-size: 9px; color: #334155; flex-shrink: 0; }
  .sm-btn {
    padding: 4px 9px; border-radius: 4px; border: 1px solid #1e2d5e;
    background: transparent; color: #64748b; font-size: 10px;
    cursor: pointer; font-family: inherit; transition: all 0.1s;
  }
  .sm-btn:hover { border-color: #2d4a7a; color: #94a3b8; }
  .q-btn {
    width: 26px; height: 26px; border-radius: 4px; border: 1px solid #1e2d5e;
    background: transparent; color: #475569; font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all 0.1s;
  }
  .q-btn.on { border-color: #3b82f6; color: #3b82f6; background: #3b82f622; }

  /* CNOT hint */
  .cnot-hint {
    display: none; margin-bottom: 10px; padding: 7px 14px;
    background: #f9731610; border: 1px solid #f9731630; border-radius: 6px;
    font-size: 10px; color: #f97316;
  }

  /* Circuit */
  .circuit-wrap {
    background: #0d1426; border: 1px solid #1e2d5e; border-radius: 12px;
    padding: 18px 20px; margin-bottom: 14px; overflow-x: auto;
  }
  .step-row { display: flex; margin-left: 40px; margin-bottom: 10px; }
  .step-lbl {
    text-align: center; font-size: 8px; color: #1e3a5f; font-weight: 600;
    flex-shrink: 0;
  }
  .q-row { display: flex; align-items: center; }
  .q-lbl {
    width: 30px; font-size: 11px; font-weight: 700; color: #3b82f6;
    text-align: right; margin-right: 8px; flex-shrink: 0;
  }
  .wire-track { display: flex; align-items: center; position: relative; flex: 1; overflow: visible; }
  .wire-line {
    position: absolute; left: 0; right: 4px; height: 2px;
    background: linear-gradient(90deg, #0f1f3d, #1d4ed844, #0f1f3d);
    top: 50%; transform: translateY(-50%); z-index: 0; pointer-events: none;
  }
  .cell-wrap { position: relative; flex-shrink: 0; z-index: 1; overflow: visible; }
  .cell {
    width: 36px; height: 36px; border-radius: 6px;
    border: 2px dashed #1e2d5e55;
    background: transparent; color: transparent;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; z-index: 2;
    font-family: inherit; transition: all 0.1s; user-select: none;
  }
  .cell:hover { border-color: #2d4a7a88 !important; background: #1e2d5e22 !important; }
  .cnot-vline {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 2px; pointer-events: none; z-index: 1;
  }
  .measure-sym { margin-left: 10px; font-size: 11px; color: #34d39966; flex-shrink: 0; }

  /* Probabilities */
  .prob-wrap {
    background: #0d1426; border: 1px solid #1e2d5e; border-radius: 12px;
    padding: 18px 20px;
  }
  .prob-heading { font-size: 9px; color: #3b82f6; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 14px; }
  .prob-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .prob-lbl { font-size: 11px; font-weight: 600; flex-shrink: 0; width: 56px; }
  .bar-bg { flex: 1; height: 22px; background: #060a12; border-radius: 4px; overflow: hidden; position: relative; }
  .bar-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #1d4ed8, #7c3aed);
    transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
    display: flex; align-items: center; padding-left: 6px; box-sizing: border-box;
  }
  .bar-pct-in { font-size: 9px; color: white; font-weight: 700; white-space: nowrap; }
  .bar-pct-out {
    position: absolute; left: 6px; top: 0; bottom: 0;
    display: flex; align-items: center; font-size: 9px;
  }
  .amp-val { width: 158px; font-size: 9px; text-align: right; flex-shrink: 0; }
  .prob-footer {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid #0f1f3d;
    font-size: 10px; color: #334155; display: flex; gap: 20px; flex-wrap: wrap;
  }
</style>
</head>
<body>

<div class="eyebrow">◆ Quantum Circuit Builder</div>
<div class="title">Interactive Simulator</div>
<div class="subtitle">Left-click to place a gate · Right-click to remove · CX gate: click control qubit, then target qubit in the same column</div>

<div class="toolbar" id="toolbar"></div>
<div class="cnot-hint" id="cnotHint"></div>
<div class="circuit-wrap" id="circuitWrap"></div>
<div class="prob-wrap" id="probWrap"></div>

<script>
// ─── Constants ───────────────────────────────────────────────────
const CSIZE = 36, RGAP = 16, RSTRIDE = CSIZE + RGAP, CGAP = 8, STEPS = 7;

const GATE_INFO = {
  H:    { label:'H',  color:'#3b82f6', title:'Hadamard', desc:'Creates superposition ½(|0⟩+|1⟩)' },
  X:    { label:'X',  color:'#f43f5e', title:'Pauli-X',  desc:'Quantum NOT: flips |0⟩↔|1⟩' },
  Y:    { label:'Y',  color:'#f59e0b', title:'Pauli-Y',  desc:'Y-axis Bloch rotation' },
  Z:    { label:'Z',  color:'#10b981', title:'Pauli-Z',  desc:'Phase flip |1⟩→−|1⟩' },
  S:    { label:'S',  color:'#06b6d4', title:'S Gate',   desc:'90° phase shift' },
  T:    { label:'T',  color:'#8b5cf6', title:'T Gate',   desc:'45° phase shift' },
  CNOT: { label:'CX', color:'#f97316', title:'CNOT',     desc:'Controlled-NOT: entangles qubits' },
};

// ─── State ───────────────────────────────────────────────────────
let nq = 2;
let circuit = {};      // "q-s" → { type, target?, control? }
let selGate = 'H';
let cnotPend = null;   // { q, s }

// ─── Complex math ────────────────────────────────────────────────
const C = (re, im=0) => ({re,im});
const cadd = (a,b) => ({re:a.re+b.re, im:a.im+b.im});
const cmul = (a,b) => ({re:a.re*b.re-a.im*b.im, im:a.re*b.im+a.im*b.re});
const S2 = 1/Math.sqrt(2);

const MATS = {
  H: [[C(S2),C(S2)],[C(S2),C(-S2)]],
  X: [[C(0),C(1)],[C(1),C(0)]],
  Y: [[C(0),C(0,-1)],[C(0,1),C(0)]],
  Z: [[C(1),C(0)],[C(0),C(-1)]],
  S: [[C(1),C(0)],[C(0),C(0,1)]],
  T: [[C(1),C(0)],[C(0),C(Math.cos(Math.PI/4),Math.sin(Math.PI/4))]],
};

function applyGate(state, n, q, G) {
  const size = 1<<n;
  const out = Array.from({length:size}, ()=>C(0));
  const bit = n-1-q;
  for (let i=0; i<size; i++) {
    if ((i>>bit)&1) continue;
    const i0=i, i1=i|(1<<bit);
    out[i0] = cadd(cmul(G[0][0],state[i0]), cmul(G[0][1],state[i1]));
    out[i1] = cadd(cmul(G[1][0],state[i0]), cmul(G[1][1],state[i1]));
  }
  return out;
}

function applyCNOT(state, n, ctrl, tgt) {
  const size=1<<n, cb=n-1-ctrl, tb=n-1-tgt;
  const out = Array.from({length:size}, ()=>C(0));
  for (let i=0; i<size; i++) {
    out[((i>>cb)&1) ? i^(1<<tb) : i] = {...state[i]};
  }
  return out;
}

function simulate() {
  let sv = Array.from({length:1<<nq}, (_,i)=>C(i===0?1:0));
  for (let s=0; s<STEPS; s++) {
    const done = new Set();
    for (let q=0; q<nq; q++) {
      const g = circuit[`${q}-${s}`];
      if (g?.type==='CNOT_CONTROL' && !done.has(q)) {
        sv = applyCNOT(sv, nq, q, g.target);
        done.add(q); done.add(g.target);
      }
    }
    for (let q=0; q<nq; q++) {
      if (done.has(q)) continue;
      const g = circuit[`${q}-${s}`];
      if (g && MATS[g.type]) sv = applyGate(sv, nq, q, MATS[g.type]);
    }
  }
  return sv;
}

// ─── Presets ─────────────────────────────────────────────────────
function getPreset(name) {
  if (name==='bell') return { nq:2, circ:{
    '0-0':{type:'H'},
    '0-1':{type:'CNOT_CONTROL',target:1},
    '1-1':{type:'CNOT_TARGET',control:0},
  }};
  if (name==='ghz') return { nq:3, circ:{
    '0-0':{type:'H'},
    '0-1':{type:'CNOT_CONTROL',target:1},'1-1':{type:'CNOT_TARGET',control:0},
    '1-2':{type:'CNOT_CONTROL',target:2},'2-2':{type:'CNOT_TARGET',control:1},
  }};
  if (name==='qft2') return { nq:2, circ:{
    '0-0':{type:'H'},
    '0-1':{type:'S'},
    '0-2':{type:'T'},
    '1-3':{type:'H'},
  }};
  if (name==='hAll') {
    const circ={};
    for (let q=0;q<nq;q++) circ[`${q}-0`]={type:'H'};
    return { nq, circ };
  }
}

// ─── Helpers ─────────────────────────────────────────────────────
function fmtAmp(a) {
  const rs = a.re.toFixed(3);
  const ia = Math.abs(a.im).toFixed(3);
  return `${rs}${a.im>=0?'+':'-'}${ia}i`;
}

function clearCNOTAt(key, step) {
  const old = circuit[key];
  if (!old) return;
  if (old.type==='CNOT_CONTROL') delete circuit[`${old.target}-${step}`];
  if (old.type==='CNOT_TARGET')  delete circuit[`${old.control}-${step}`];
  delete circuit[key];
}

// ─── Actions ─────────────────────────────────────────────────────
function setSel(g) { selGate=g; cnotPend=null; render(); }

function changeQ(n) { nq=n; circuit={}; cnotPend=null; render(); }

function clearCircuit() { circuit={}; cnotPend=null; render(); }

function loadPreset(name) {
  const p = getPreset(name);
  nq=p.nq; circuit={...p.circ}; cnotPend=null; render();
}

function clickCell(q, s) {
  if (selGate==='CNOT') {
    if (!cnotPend) {
      cnotPend={q,s};
    } else if (cnotPend.s===s && cnotPend.q!==q) {
      const ctrl=cnotPend.q, tgt=q;
      clearCNOTAt(`${ctrl}-${s}`, s);
      clearCNOTAt(`${tgt}-${s}`, s);
      circuit[`${ctrl}-${s}`]={type:'CNOT_CONTROL',target:tgt};
      circuit[`${tgt}-${s}`]={type:'CNOT_TARGET',control:ctrl};
      cnotPend=null;
    } else {
      cnotPend={q,s};
    }
    render(); return;
  }
  const key=`${q}-${s}`;
  if (circuit[key]?.type===selGate) {
    clearCNOTAt(key, s);
  } else {
    clearCNOTAt(key, s);
    circuit[key]={type:selGate};
  }
  render();
}

function rmCell(e, q, s) {
  e.preventDefault();
  clearCNOTAt(`${q}-${s}`, s);
  render();
}

// ─── Render ──────────────────────────────────────────────────────
function renderToolbar() {
  let h = '';
  for (const [k,info] of Object.entries(GATE_INFO)) {
    const on = selGate===k;
    const style = on
      ? `border-color:${info.color};background:${info.color}20;color:${info.color};box-shadow:0 0 10px ${info.color}44`
      : ``;
    h += `<button class="gate-btn" style="${style}" onclick="setSel('${k}')" title="${info.title}: ${info.desc}">${info.label}</button>`;
  }
  h += `<div class="divider"></div>`;
  h += `<span class="gate-title" style="color:${GATE_INFO[selGate].color}">${GATE_INFO[selGate].title}${selGate==='CNOT'&&cnotPend?` · ctrl@q${cnotPend.q}`:''}</span>`;
  h += `<div class="right-group">`;
  h += `<span class="label-xs">PRESET:</span>`;
  h += `<button class="sm-btn" onclick="loadPreset('bell')">Bell</button>`;
  h += `<button class="sm-btn" onclick="loadPreset('ghz')">GHZ</button>`;
  h += `<button class="sm-btn" onclick="loadPreset('hAll')">H⊗n</button>`;
  h += `<button class="sm-btn" onclick="loadPreset('qft2')">QFT</button>`;
  h += `<div class="divider"></div>`;
  h += `<span class="label-xs">QUBITS:</span>`;
  for (const n of [2,3,4]) {
    h += `<button class="q-btn${nq===n?' on':''}" onclick="changeQ(${n})">${n}</button>`;
  }
  h += `<div class="divider"></div>`;
  h += `<button class="sm-btn" onclick="clearCircuit()">Clear</button>`;
  h += `</div>`;
  document.getElementById('toolbar').innerHTML = h;
}

function renderHint() {
  const el = document.getElementById('cnotHint');
  if (selGate==='CNOT') {
    el.style.display='block';
    el.textContent = cnotPend
      ? `● Control at q${cnotPend.q} step ${cnotPend.s+1} — now click another qubit in the same column to set ⊕ target`
      : '● Click any qubit cell to place the CNOT control (●), then click another qubit in the same column for the target (⊕)';
  } else {
    el.style.display='none';
  }
}

function renderCircuit() {
  let h = '';

  // Step labels
  h += `<div class="step-row">`;
  for (let s=0; s<STEPS; s++) {
    h += `<div class="step-lbl" style="width:${CSIZE}px;margin-right:${s<STEPS-1?CGAP:0}px">t${s+1}</div>`;
  }
  h += `</div>`;

  // Qubit rows
  for (let q=0; q<nq; q++) {
    h += `<div class="q-row" style="margin-bottom:${q<nq-1?RGAP:0}px">`;
    h += `<div class="q-lbl">q${q}</div>`;
    h += `<div class="wire-track">`;
    h += `<div class="wire-line"></div>`;

    for (let s=0; s<STEPS; s++) {
      const key=`${q}-${s}`, gate=circuit[key];
      const isPend = cnotPend?.q===q && cnotPend?.s===s;
      const gt = gate?.type;

      let text='', clr='transparent', bg='transparent', brd='#1e2d5e55', brdSty='dashed', glow='none', fs=12;

      if (gt==='CNOT_CONTROL') {
        text='●'; clr=GATE_INFO.CNOT.color; bg=`${GATE_INFO.CNOT.color}18`;
        brd=GATE_INFO.CNOT.color; brdSty='solid'; glow=`0 0 12px ${GATE_INFO.CNOT.color}55`;
      } else if (gt==='CNOT_TARGET') {
        text='⊕'; clr=GATE_INFO.CNOT.color; bg=`${GATE_INFO.CNOT.color}12`;
        brd=`${GATE_INFO.CNOT.color}88`; brdSty='solid'; fs=18;
      } else if (gt && GATE_INFO[gt]) {
        text=GATE_INFO[gt].label; clr=GATE_INFO[gt].color; bg=`${GATE_INFO[gt].color}1a`;
        brd=GATE_INFO[gt].color; brdSty='solid'; glow=`0 0 12px ${GATE_INFO[gt].color}55`;
      } else if (isPend) {
        text='●'; clr=GATE_INFO.CNOT.color; bg=`${GATE_INFO.CNOT.color}18`;
        brd=GATE_INFO.CNOT.color; brdSty='solid';
      }

      const cellStyle = `border-style:${brdSty};border-color:${brd};background:${bg};color:${clr};font-size:${fs}px;box-shadow:${glow};`;

      // CNOT vertical line
      let vline = '';
      if (gt==='CNOT_CONTROL') {
        const tgt=gate.target, lineH=Math.abs(tgt-q)*RSTRIDE;
        const dir = tgt>q ? `top:50%` : `bottom:50%`;
        vline = `<div class="cnot-vline" style="height:${lineH}px;${dir};background:${GATE_INFO.CNOT.color}"></div>`;
      }

      h += `<div class="cell-wrap" style="margin-right:${s<STEPS-1?CGAP:0}px">`;
      h += vline;
      h += `<div class="cell" style="${cellStyle}" onclick="clickCell(${q},${s})" oncontextmenu="rmCell(event,${q},${s})" title="${gt&&GATE_INFO[gt.startsWith('CNOT')?'CNOT':gt]?GATE_INFO[gt.startsWith('CNOT')?'CNOT':gt].desc:''}">${text}</div>`;
      h += `</div>`;
    }

    h += `<div class="measure-sym">⊢M</div>`;
    h += `</div></div>`;
  }

  document.getElementById('circuitWrap').innerHTML = h;
}

function renderProbs() {
  const sv = simulate();
  const probs = sv.map(a => a.re*a.re + a.im*a.im);
  const maxP = Math.max(...probs, 1e-9);
  const nActive = probs.filter(p=>p>1e-5).length;
  const norm = probs.reduce((s,p)=>s+p,0);
  const size = 1<<nq;

  let h = `<div class="prob-heading">Measurement Probabilities</div>`;
  for (let i=0; i<size; i++) {
    const label = '|'+i.toString(2).padStart(nq,'0')+'⟩';
    const prob=probs[i]||0, pct=prob*100, barW=(prob/maxP)*100;
    const sig=prob>1e-5;
    const lclr=sig?'#94a3b8':'#1e293b', aclr=sig?'#475569':'#1e293b';

    h+=`<div class="prob-row">`;
    h+=`<div class="prob-lbl" style="color:${lclr}">${label}</div>`;
    h+=`<div class="bar-bg">`;
    h+=`<div class="bar-fill" style="width:${barW}%;${sig?'':'background:#0d1426'}">`;
    if (pct>9) h+=`<span class="bar-pct-in">${pct.toFixed(1)}%</span>`;
    h+=`</div>`;
    if (pct<=9) h+=`<span class="bar-pct-out" style="color:${sig?'#475569':'#1e293b'}">${pct.toFixed(1)}%</span>`;
    h+=`</div>`;
    h+=`<div class="amp-val" style="color:${aclr}">${fmtAmp(sv[i])}</div>`;
    h+=`</div>`;
  }

  const stateClr = nActive===1?'#34d399':'#7c3aed';
  const stateMsg = nActive===1
    ? '◉ Pure state — measured result is deterministic'
    : `◉ Superposition — ${nActive} states with nonzero amplitude`;
  h+=`<div class="prob-footer">`;
  h+=`<span style="color:${stateClr}">${stateMsg}</span>`;
  h+=`<span>Σ|αᵢ|² = ${norm.toFixed(5)}</span>`;
  h+=`</div>`;

  document.getElementById('probWrap').innerHTML = h;
}

function render() { renderToolbar(); renderHint(); renderCircuit(); renderProbs(); }

// Boot with Bell state
loadPreset('bell');
</script>
</body>
</html>
